[project]
name = "promptectomy"
version = "0.3.1"
description = "Find LLM calls you can replace with tested Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "cryptography>=44",
    "groq>=1.0",
    "pandas>=2.2",
    "psutil>=7.2; sys_platform == 'darwin'",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "scikit-learn>=1.6",
    "typer>=0.15",
]

[project.urls]
Repository = "https://github.com/ArjunCodess/promptectomy"

[project.scripts]
promptectomy = "promptectomy.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["promptectomy"]
package-dir = {promptectomy = "src"}

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "tiktoken>=0.12"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
